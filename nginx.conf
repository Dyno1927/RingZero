server {
  listen 8080;
  listen [::]:8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }

  location = /404.html {
    internal;
  }

  error_page 404 /404.html;

  location ^~ /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }
}
