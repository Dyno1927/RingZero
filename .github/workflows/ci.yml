name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  site:
    name: Format and build site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: |
          npx prettier --check "src/**/*.{css,mdx,ts,mjs}" astro.config.mjs README.md package.json Scripts/CheckContentLinks.mjs
          npx prettier --parser html --check "src/assets/*.svg"

      - name: Build static site
        run: npm run build

      - name: Check internal content links
        run: npm run check:content-links

  container:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: site
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ring0:ci
